min_version: 2.1.0

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,md,yml,yaml,css}'
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    check-types:
      run: pnpm check-types
    test:
      run: pnpm test
