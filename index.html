<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn Markdown into print-ready documents, entirely in your browser. No account, no upload."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Styledown — Markdown to print-ready documents</title>

    <!--
      What a pasted link unfurls into. `og:image` has to be absolute — a crawler resolves it
      against nothing — so this one URL is written out in full rather than left to the base
      path, and it is the only place in the app that knows where it is deployed.
      `public/og.png` is generated by `scripts/screenshot.mjs`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Styledown — Markdown to print-ready documents" />
    <meta
      property="og:description"
      content="Write on the left, watch the document build itself on the right, then print a PDF that reads like a document. Nothing is uploaded."
    />
    <meta property="og:url" content="https://ddanielcruz.github.io/styledown/" />
    <meta property="og:image" content="https://ddanielcruz.github.io/styledown/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Markdown source on the left, the same document typeset on a page on the right."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!-- The whole product is a renderer that runs in the page. There is no server-rendered
         half to fall back to, so the honest answer is the short one. -->
    <noscript>
      <p style="font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 34rem">
        Styledown builds your document in the browser, so it needs JavaScript. Nothing you write is
        sent anywhere — that is the same reason there is no server to render this page for you.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
