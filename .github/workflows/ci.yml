name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve the store
      # path. Version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest first, so an obvious failure reports in seconds rather than
      # after a build. Each step runs regardless of earlier failures, so one push
      # surfaces every problem instead of one per re-run.
      - name: Format
        if: '!cancelled()'
        run: pnpm format:check

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Check types
        if: '!cancelled()'
        run: pnpm check-types

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      - name: Build
        if: '!cancelled()'
        run: pnpm build

      # Last because it is much the most expensive step, and everything above it can fail
      # in seconds. The browsers are ~1GB of downloads, so they are cached on the lockfile:
      # the version that decides which builds are wanted lives in `playwright`'s entry.
      - name: Cache browsers
        if: '!cancelled()'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` is the system libraries the three engines link against, which a bare
      # runner does not have and the cache above cannot hold. It is a no-op once they are
      # installed, and the browser downloads themselves are skipped on a cache hit.
      - name: Install browsers
        if: '!cancelled()'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Test in browsers
        if: '!cancelled()'
        run: pnpm test:browser
